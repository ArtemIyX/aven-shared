name: Publish Aven packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify release is running from main
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node scripts/release-mode.mjs "$RELEASE_EVENT" "$RELEASE_REF"

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a validation-diagnostics.log

      - name: Type check
        run: npm run typecheck 2>&1 | tee -a validation-diagnostics.log

      - name: Build package
        run: npm run build 2>&1 | tee -a validation-diagnostics.log

      - name: Build playground
        run: npm run build:playground 2>&1 | tee -a validation-diagnostics.log

      - name: Run tests
        run: npm test 2>&1 | tee -a validation-diagnostics.log

      - name: Check colors
        run: npm run colors:check

      - name: Validate packed consumer
        run: npm run pack:consumer

      - name: Validate package contents
        run: npm run pack:check 2>&1 | tee -a validation-diagnostics.log

      - name: Upload validation logs and build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation-diagnostics.log
            packages/shared/dist/
            packages/vue/dist/
            playground/dist/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish merged version
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global 'npm@^11.5.1' 2>&1 | tee -a release-diagnostics.log

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a release-diagnostics.log

      - name: Download validated build outputs
        uses: actions/download-artifact@v8
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Ensure main still matches the validated source
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced after validation. Rerun the release workflow on the latest main commit."
            exit 1
          fi

      - name: Check both packages and versions on npm
        run: |
          mkdir -p .release-artifacts
          for workspace in shared vue; do
            name="$(node -p "require('./packages/$workspace/package.json').name")"
            version="$(node -p "require('./packages/$workspace/package.json').version")"
            if ! npm view "$name" version --json > ".release-artifacts/$workspace-package-view.log" 2>&1; then
              cat ".release-artifacts/$workspace-package-view.log"
              echo "::error::Cannot verify $name. Bootstrap new packages and configure trusted publishing before automated release."
              exit 1
            fi
            if npm view "$name@$version" version --json > ".release-artifacts/$workspace-version-view.log" 2>&1; then
              echo skip > ".release-artifacts/$workspace-action"
              echo "$name@$version already exists; skipping." >> "$GITHUB_STEP_SUMMARY"
            elif grep -Eq 'E404|404 Not Found' ".release-artifacts/$workspace-version-view.log"; then
              echo publish > ".release-artifacts/$workspace-action"
            else
              cat ".release-artifacts/$workspace-version-view.log"
              echo "::error::Could not verify $name@$version on npm."
              exit 1
            fi
          done

      - name: Pack and publish in dependency order
        run: |
          for workspace in shared vue; do
            if [[ "$(cat ".release-artifacts/$workspace-action")" == skip ]]; then continue; fi
            if [[ "$workspace" == vue ]]; then
              range="$(node -p "require('./packages/vue/package.json').dependencies['@wellsaik/aven-shared']")"
              if ! npm view "@wellsaik/aven-shared@$range" version --json > .release-artifacts/shared-dependency-view.log 2>&1; then
                cat .release-artifacts/shared-dependency-view.log
                echo "::error::Vue's shared dependency is not available on npm; aborting Vue publication."
                exit 1
              fi
            fi
            npm pack --json --workspace "packages/$workspace" --pack-destination .release-artifacts > ".release-artifacts/$workspace-pack.json"
            filename="$(node -p "require('./.release-artifacts/$workspace-pack.json')[0].filename")"
            npm publish ".release-artifacts/$filename" --access public 2>&1 | tee -a release-diagnostics.log
          done

      - name: Upload release diagnostics and package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-diagnostics.log
            pack-result.json
            .release-artifacts/
          if-no-files-found: warn
          retention-days: 14
