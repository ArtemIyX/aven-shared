name: Publish @wellsaik/aven-shared

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify release is running from main
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node scripts/release-mode.mjs "$RELEASE_EVENT" "$RELEASE_REF"

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a validation-diagnostics.log

      - name: Type check
        run: npm run typecheck 2>&1 | tee -a validation-diagnostics.log

      - name: Build package
        run: npm run build 2>&1 | tee -a validation-diagnostics.log

      - name: Build playground
        run: npm run build:playground 2>&1 | tee -a validation-diagnostics.log

      - name: Run tests
        run: npm test 2>&1 | tee -a validation-diagnostics.log

      - name: Validate package contents
        run: npm run pack:check 2>&1 | tee -a validation-diagnostics.log

      - name: Upload validation logs and build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation-diagnostics.log
            dist/
            playground/dist/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish merged version
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global 'npm@^11.5.1' 2>&1 | tee -a release-diagnostics.log

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a release-diagnostics.log

      - name: Download validated build outputs
        uses: actions/download-artifact@v8
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Ensure main still matches the validated source
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced after validation. Rerun the release workflow on the latest main commit."
            exit 1
          fi

      - name: Read merged package version
        id: version
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check package and version on npm
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .release-artifacts

          if ! npm view '@wellsaik/aven-shared' version --json > .release-artifacts/package-view.log 2>&1; then
            if grep -Eq 'E404|404 Not Found' .release-artifacts/package-view.log; then
              echo '::error::The package is not on npm yet. Complete the documented one-time public 0.1.0 bootstrap before enabling automated releases.'
            else
              cat .release-artifacts/package-view.log
              echo '::error::Could not verify the package on npm.'
            fi
            exit 1
          fi

          if npm view "@wellsaik/aven-shared@$VERSION" version --json > .release-artifacts/version-view.log 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already published; skipping the duplicate publish." >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq 'E404|404 Not Found' .release-artifacts/version-view.log; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            cat .release-artifacts/version-view.log
            echo '::error::Could not verify the requested version on npm.'
            exit 1
          fi

      - name: Validate and pack release tarball
        if: steps.registry.outputs.publish == 'true'
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run pack:check 2>&1 | tee -a release-diagnostics.log
          npm pack --json --pack-destination .release-artifacts > pack-result.json 2>> release-diagnostics.log
          filename="$(node -p "JSON.parse(require('node:fs').readFileSync('pack-result.json', 'utf8'))[0].filename")"
          echo "file=.release-artifacts/$filename" >> "$GITHUB_OUTPUT"
          echo "Prepared @wellsaik/aven-shared@$VERSION as .release-artifacts/$filename" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public package with npm OIDC
        if: steps.registry.outputs.publish == 'true'
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: npm publish "$PACKAGE_FILE" --access public 2>&1 | tee -a release-diagnostics.log

      - name: Upload release diagnostics and package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-diagnostics.log
            pack-result.json
            .release-artifacts/
          if-no-files-found: warn
          retention-days: 14
