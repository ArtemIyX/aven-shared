name: Publish @aven/shared

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version change to publish
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - current

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify main ref and resolve release mode
        id: resolve
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_BUMP: ${{ inputs.bump }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          bump="$(node scripts/release-mode.mjs "$RELEASE_EVENT" "$REQUESTED_BUMP" "$RELEASE_REF")"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a validation-diagnostics.log

      - name: Type check
        run: npm run typecheck 2>&1 | tee -a validation-diagnostics.log

      - name: Build package
        run: npm run build 2>&1 | tee -a validation-diagnostics.log

      - name: Build playground
        run: npm run build:playground 2>&1 | tee -a validation-diagnostics.log

      - name: Run tests
        run: npm test 2>&1 | tee -a validation-diagnostics.log

      - name: Validate package contents
        run: npm run pack:check 2>&1 | tee -a validation-diagnostics.log

      - name: Upload validation logs and build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation-diagnostics.log
            dist/
            playground/dist/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Bump version and publish
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global 'npm@^11.5.1' 2>&1 | tee -a release-diagnostics.log

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a release-diagnostics.log

      - name: Download validated build outputs
        uses: actions/download-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Ensure main still matches the validated source
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced after validation. Rerun the release workflow on the latest main commit."
            exit 1
          fi

      - name: Bump version when requested
        id: version
        env:
          BUMP: ${{ needs.validate.outputs.bump }}
        run: |
          if [[ "$BUMP" != "current" ]]; then
            npm version "$BUMP" --no-git-tag-version 2>&1 | tee -a release-diagnostics.log
          fi
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check package and version on npm
        id: registry
        env:
          BUMP: ${{ needs.validate.outputs.bump }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .release-artifacts

          if ! npm view '@aven/shared' version --json > .release-artifacts/package-view.log 2>&1; then
            if grep -Eq 'E404|404 Not Found' .release-artifacts/package-view.log; then
              echo '::error::The package is not on npm yet. Complete the documented one-time public 0.1.0 bootstrap before enabling automated releases.'
            else
              cat .release-artifacts/package-view.log
              echo '::error::Could not verify the package on npm.'
            fi
            exit 1
          fi

          if npm view "@aven/shared@$VERSION" version --json > .release-artifacts/version-view.log 2>&1; then
            if [[ "$BUMP" == "current" ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo "Version $VERSION is already published; skipping the duplicate publish." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Version $VERSION is already published. No version commit was pushed; select current to confirm it or choose a new release after reconciling package.json."
              exit 1
            fi
          elif grep -Eq 'E404|404 Not Found' .release-artifacts/version-view.log; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            cat .release-artifacts/version-view.log
            echo '::error::Could not verify the requested version on npm.'
            exit 1
          fi

      - name: Validate and pack release tarball
        if: steps.registry.outputs.publish == 'true'
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run pack:check 2>&1 | tee -a release-diagnostics.log
          npm pack --json --pack-destination .release-artifacts > pack-result.json 2>> release-diagnostics.log
          filename="$(node -p "JSON.parse(require('node:fs').readFileSync('pack-result.json', 'utf8'))[0].filename")"
          echo "file=.release-artifacts/$filename" >> "$GITHUB_OUTPUT"
          echo "Prepared @aven/shared@$VERSION as .release-artifacts/$filename" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version bump to main
        if: needs.validate.outputs.bump != 'current' && steps.registry.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: release v$VERSION"
          git push origin HEAD:main

      - name: Publish public package with npm OIDC
        if: steps.registry.outputs.publish == 'true'
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: npm publish "$PACKAGE_FILE" --access public 2>&1 | tee -a release-diagnostics.log

      - name: Upload release diagnostics and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-diagnostics.log
            pack-result.json
            .release-artifacts/
          if-no-files-found: warn
          retention-days: 14
