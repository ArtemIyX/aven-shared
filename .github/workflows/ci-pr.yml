name: CI - Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package and playground
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a build-diagnostics.log

      - name: Build package
        run: npm run build 2>&1 | tee -a build-diagnostics.log

      - name: Build playground
        run: npm run build:playground 2>&1 | tee -a build-diagnostics.log

      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-diagnostics.log
            dist/
            playground/dist/
          if-no-files-found: warn
          retention-days: 14

  checks:
    name: Type checks, tests, and package checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a checks-diagnostics.log

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Type check
        run: npm run typecheck 2>&1 | tee -a checks-diagnostics.log

      - name: Run tests
        run: npm test 2>&1 | tee -a checks-diagnostics.log

      - name: Check packed package contents
        run: npm run pack:check 2>&1 | tee -a checks-diagnostics.log

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: checks-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
